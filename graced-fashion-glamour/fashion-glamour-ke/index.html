<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fashion Glamour KE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand"><span>Graced Fashion and Glamour</span><h1>Fashion Glamour KE</h1></div>
      <button class="btn" id="logout" type="button">Log out</button>
    </header>
    <main class="soon">
      <h2>Fashion Glamour KE is set up and waiting</h2>
      <p>You are signed in to this account. The system itself is the next thing we build here, in this folder.</p>
      <p class="hint">Files for this account live in <code>fashion-glamour-ke/</code>.</p>
    </main>
  </div>
  <script src="../shared/auth.js"></script>
  <script>
    if(GFG_AUTH.require('fashion-glamour-ke')){
      document.getElementById('logout').addEventListener('click',function(){GFG_AUTH.logout();});
    }
  </script>
</body>
</html>
