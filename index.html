<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graced Fashion and Glamour</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="shared/login.css">
</head>
<body>
  <main class="login">
    <div class="brand"><span>Sign in</span><h1>Graced Fashion and Glamour</h1></div>
    <form class="box" id="loginForm" autocomplete="on">
      <p class="sub">Use the username and password for your account. You will go straight to that account's own page.</p>
      <div class="field"><label for="u">Username</label><input id="u" name="username" required autocomplete="username" autocapitalize="none" spellcheck="false"></div>
      <div class="field"><label for="p">Password</label><input id="p" name="password" type="password" required autocomplete="current-password"></div>
      <p class="err" id="err" role="alert" hidden>That username or password is not right. Try again.</p>
      <button class="btn" type="submit">Sign in</button>
    </form>
    <p class="fine">Accounts: Custom Couture, Fashion Glamour KE and Silky Stylish. Each one is a separate page.</p>
  </main>
  <script src="shared/auth.js"></script>
  <script>
    (function(){
      var done=GFG_AUTH.session();
      if(done){var a=GFG_AUTH.accounts.filter(function(x){return x.id===done;})[0];if(a){location.replace(a.page);return;}}
      document.getElementById('loginForm').addEventListener('submit',function(e){
        e.preventDefault();
        var acc=GFG_AUTH.login(document.getElementById('u').value,document.getElementById('p').value);
        if(acc){location.href=acc.page;}
        else{document.getElementById('err').hidden=false;document.getElementById('p').value='';document.getElementById('p').focus();}
      });
    })();
  </script>
</body>
</html>
