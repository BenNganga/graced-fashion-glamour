<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silky Stylish</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* css/base.css */
/* Colours (light and dark), page layout, header, tabs and headings. Change the look of the whole app here. */
:root{
  --bg:#f4f6f5; --surface:#ffffff; --fg:#13292c; --muted:#5d7276; --line:#d9e2e1;
  --accent:#1c5d63; --accent-fg:#ffffff; --gold:#b8892e; --soft:#e4eeed;
  --good:#2b7a52; --warn:#a8650a; --bad:#b3261e;
  --display:'Cormorant Garamond',Georgia,serif; --body:'DM Sans',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1a1c; --surface:#122629; --fg:#e8f2f1; --muted:#9bb5b8; --line:#244246;
  --accent:#5cc0c8; --accent-fg:#06191b; --gold:#e0b862; --soft:#183236;
  --good:#6fd1a0; --warn:#f0b35a; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1a1c; --surface:#122629; --fg:#e8f2f1; --muted:#9bb5b8; --line:#244246;
  --accent:#5cc0c8; --accent-fg:#06191b; --gold:#e0b862; --soft:#183236;
  --good:#6fd1a0; --warn:#f0b35a; --bad:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:1000px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:8px 0 14px}
.brand h1{font-family:var(--display);font-weight:700;font-size:32px;line-height:1;margin:0}
.brand span{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--gold);font-weight:700}
.hright{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:18px}
nav button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font:500 14px var(--body);padding:9px 16px;border-radius:999px;cursor:pointer}
nav button[aria-current="true"]{background:var(--accent);color:var(--accent-fg)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-family:var(--display);font-size:27px;font-weight:600;margin:0 0 4px;line-height:1.1}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:20px 0 10px;font-weight:700}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between}

/* css/components.css */
/* Buttons, tiles, lists, pills, filters, form fields, notes. */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 13px var(--body);padding:8px 13px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.kpi b{display:block;font-family:var(--display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 14px}
.item{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item:last-child{border-bottom:0}
.item .main{min-width:0;flex:1 1 220px}
.item .t{font-weight:700;overflow-wrap:anywhere}
.item .m{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.item .side{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--fg);white-space:nowrap}
.pill.no{background:var(--accent);color:var(--accent-fg);letter-spacing:.04em}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.gold{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold)}
.money{font-variant-numeric:tabular-nums;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.filters button{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:500 12px var(--body);padding:5px 11px;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.field input,.field select,.field textarea{font:15px var(--body);padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%;min-width:0}
.field input[readonly]{opacity:.75}
.controls .field{margin:0;flex:1 1 180px;max-width:280px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.two{grid-template-columns:1fr}}
.empty{padding:20px 0;color:var(--muted);text-align:center}
.note{background:var(--soft);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--muted);margin-bottom:16px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
dl{display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:7px 12px;margin:0;font-size:14px}
dt{color:var(--muted)} dd{margin:0;font-weight:500;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.links{display:flex;gap:6px;flex-wrap:wrap}

/* css/modal.css */
/* Pop-up windows (order sheet and forms). */
.overlay{position:fixed;inset:0;background:rgba(5,18,20,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20;
  padding:16px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media(min-width:600px){.overlay{align-items:center}}
.modal{background:var(--surface);color:var(--fg);border-radius:14px;width:100%;max-width:540px;max-height:100%;overflow-y:auto;padding:18px}
.modal h2{margin-bottom:10px}
.modal h3{margin:16px 0 8px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}

/* css/calendar.css */
/* Calendar grid and its dots. */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-align:center;padding:4px 0}
.cal .day{aspect-ratio:1/1;min-height:46px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);padding:4px;font:500 13px var(--body);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left}
.cal .day.making{background:var(--soft)}
.cal .day.out{opacity:.4}
.cal .day.today{border:2px solid var(--accent)}
.cal .day[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:-2px}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%}
.dot.pick{background:var(--accent)} .dot.fit{background:var(--gold)} .dot.late{background:var(--bad)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:8px 0 0;flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}

/* css/tables-charts.css */
/* Tables and line charts. */
.tblbox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.stack{display:grid;gap:16px}
.chartbox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 10px 4px;min-width:0}
.chartbox h4{margin:0 0 4px;font-size:13px;font-weight:700}
.chart{display:block;width:100%;min-width:520px;height:auto}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .grid.zero{stroke:var(--muted);stroke-width:1.2}
.chart .tick{fill:var(--muted);font:11px var(--body)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.12;stroke:none}
.chart .pt{fill:var(--accent);stroke:var(--surface);stroke-width:1.5}
.chart .val{fill:var(--fg);font:700 12px var(--body);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}

/* Login screen. Only used in the single-file version made by tools/build-single.js. */
.login-page .login{max-width:400px;margin:10vh auto 0}
.login-page .brand{text-align:center;margin-bottom:20px}
.login-page .brand h1{font-size:38px}
.login-page .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.login-page .box .field{margin-bottom:14px}
.login-page .box input{font-size:16px}
.login-page .submit{width:100%;border:0;background:var(--accent);color:var(--accent-fg);font:700 15px var(--body);padding:12px;border-radius:8px;cursor:pointer}
.login-page .err{color:var(--bad);font-size:13px;margin:0 0 12px}
.login-page .fine{font-size:12px;color:var(--muted);text-align:center;margin:14px 0 0}

</style>

<script>
/* ../shared/auth.js */
/* Shared login for Graced Fashion and Glamour.
   Passwords are never stored in plain text here, only a salted SHA-256 hash.
   To change a password run:  node tools/hash.js "NewPassword"
   then paste the salt and hash into the matching account below.
   NOTE: this runs in the browser, so it keeps casual visitors out but is not
   real security. Real security needs a server (see README). */
(function(){
'use strict';

function sha256hex(str){
  var maxWord=Math.pow(2,32),K=[],H=[],composite={},p=0,c;
  for(c=2;p<64;c++){
    if(!composite[c]){
      for(var i=0;i<313;i+=c)composite[i]=c;
      if(p<8)H[p]=(Math.pow(c,0.5)*maxWord)|0;
      K[p++]=(Math.pow(c,1/3)*maxWord)|0;
    }
  }
  var bytes=new TextEncoder().encode(str),l=bytes.length;
  var total=((l+9+63)>>6)<<6,buf=new Uint8Array(total);
  buf.set(bytes);buf[l]=0x80;
  var dv=new DataView(buf.buffer);
  dv.setUint32(total-8,Math.floor(l*8/maxWord));
  dv.setUint32(total-4,(l*8)>>>0);
  var w=new Array(64),h=H.slice(0);
  function rr(v,n){return (v>>>n)|(v<<(32-n));}
  for(var off=0;off<total;off+=64){
    for(var t=0;t<16;t++)w[t]=dv.getUint32(off+t*4);
    for(t=16;t<64;t++){
      var s0=rr(w[t-15],7)^rr(w[t-15],18)^(w[t-15]>>>3);
      var s1=rr(w[t-2],17)^rr(w[t-2],19)^(w[t-2]>>>10);
      w[t]=(w[t-16]+s0+w[t-7]+s1)|0;
    }
    var a=h[0],b=h[1],cc=h[2],d=h[3],e=h[4],f=h[5],g=h[6],hh=h[7];
    for(t=0;t<64;t++){
      var S1=rr(e,6)^rr(e,11)^rr(e,25),ch=(e&f)^(~e&g);
      var t1=(hh+S1+ch+K[t]+w[t])|0;
      var S0=rr(a,2)^rr(a,13)^rr(a,22),mj=(a&b)^(a&cc)^(b&cc);
      var t2=(S0+mj)|0;
      hh=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=b;b=a;a=(t1+t2)|0;
    }
    h[0]=(h[0]+a)|0;h[1]=(h[1]+b)|0;h[2]=(h[2]+cc)|0;h[3]=(h[3]+d)|0;
    h[4]=(h[4]+e)|0;h[5]=(h[5]+f)|0;h[6]=(h[6]+g)|0;h[7]=(h[7]+hh)|0;
  }
  return h.map(function(x){return ('00000000'+(x>>>0).toString(16)).slice(-8);}).join('');
}

/* id is the folder name of the account's app. usernames are matched without case. */
var ACCOUNTS=[
  {id:'silky-stylish',name:'Silky Stylish',page:'silky-stylish/index.html',usernames:['silky.stylish'],salt:'6e0c4c64557fd0be',hash:'533e556235d27b0d4db59df153a9a45740c4d1091c3739392863323a97caf833'},
  {id:'custom-couture',name:'Custom Couture',page:'custom-couture/index.html',usernames:['custom.couture'],salt:'3001fe5ad2d1a05f',hash:'bc00f32b6b668952ea097470e3edd303ab681747db3abe226cdb9cc5d93bfcc9'},
  {id:'fashion-glamour-ke',name:'Fashion Glamour KE',page:'fashion-glamour-ke/index.html',usernames:['fashion.glamour','fashion.glamour.ke'],salt:'c0b34f5344fc4736',hash:'9497320563b10d12c734aee810751dbe8abbb95180754b85b0f47d2db92d5f90'}
];
var SESSION_KEY='gfg-session';

function setSession(id){try{if(id)sessionStorage.setItem(SESSION_KEY,id);else sessionStorage.removeItem(SESSION_KEY);}catch(e){}}
function getSession(){try{return sessionStorage.getItem(SESSION_KEY);}catch(e){return null;}}

window.GFG_AUTH={
  sha256hex:sha256hex,
  accounts:ACCOUNTS,
  /* Returns the matching account or null. */
  login:function(username,password){
    var u=String(username||'').trim().toLowerCase();
    for(var i=0;i<ACCOUNTS.length;i++){
      var a=ACCOUNTS[i];
      if(a.usernames.indexOf(u)>-1&&sha256hex(a.salt+':'+password)===a.hash){setSession(a.id);return a;}
    }
    return null;
  },
  /* Call at the top of an account's app. Sends visitors back to login unless they signed in to this account. */
  require:function(id){
    var login=document.getElementById('loginView'),appEl=document.getElementById('app');
    if(getSession()===id){login.hidden=true;appEl.hidden=false;document.body.classList.remove('login-page');return true;}
    login.hidden=false;appEl.hidden=true;document.body.classList.add('login-page');
    return false;
  },
  logout:function(){setSession(null);location.reload();},
  session:getSession,
  clear:function(){setSession(null);}
};
})();

</script>

<script>
/* js/util.js */
/* Silky Stylish / js/util.js
   Small helpers: dates, money (KES), safe text, saving to the browser. No business rules here. */
'use strict';

function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function todayIso(){return iso(new Date());}
function addDays(n,from){var d=from?parse(from):new Date();d.setDate(d.getDate()+n);return iso(d);}
function diffDays(s){return Math.round((parse(s)-parse(todayIso()))/86400000);}
function fmtDate(s){return s?parse(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}):'Not set';}
function fmtFull(s){return s?parse(s).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):'Not set';}
function kes(n){var r=Math.round(n);return (r<0?'-':'')+'KES '+Math.abs(r).toLocaleString('en-KE');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return 'x'+Math.random().toString(36).slice(2,9);}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n;}
function pad(n){return n<100?String(n).padStart(2,'0'):String(n);}
function load(k){try{var r=localStorage.getItem(k);if(r)return JSON.parse(r);}catch(e){}return null;}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

</script>
<script>
/* js/model/orders.js */
/* Silky Stylish / js/model/orders.js
   Order maths: money received, balance, costs, profit, and the pick-up label. */
'use strict';

function received(o){return o.deposit+o.adds.reduce(function(a,m){return a+m.amt;},0);}
function balance(o){return Math.max(0,o.total-received(o));}
function expenses(o){return o.material+o.tailorPay+o.misc;}
function profit(o){return o.total-expenses(o);}
function active(o){return o.status!=='Picked up';}
function pickLabel(o){
  if(!o.pickup)return {t:'No pick-up date',c:''};
  if(!active(o))return {t:'Picked up',c:'good'};
  var d=diffDays(o.pickup);
  if(d<0)return {t:Math.abs(d)+'d overdue',c:'bad'};
  if(d===0)return {t:'Pick-up today',c:'warn'};
  if(d<=3)return {t:'Pick-up in '+d+'d',c:'warn'};
  return {t:'Pick-up '+fmtDate(o.pickup),c:''};
}

</script>

<script>
/* js/model/finance.js */
/* Silky Stylish / js/model/finance.js
   Money in, money used, net profit by day/week/month, and the 90-day clean-up of completed orders. */
'use strict';

/* Money in is counted on the day each payment was received (the deposit on the order date).
   Money used (material, tailor payment, miscellaneous) is counted on the order date. */
function archiveOrder(o){
  var A=S.archive;function day(k){return A[k]||(A[k]={inn:0,out:0,orders:0});}
  if(o.deposit>0)day(o.date).inn+=o.deposit;
  o.adds.forEach(function(m){day(m.date).inn+=m.amt;});
  day(o.date).out+=expenses(o);
  day(o.date).orders+=1;
}
/* Completed orders are removed 90 days after they were picked up. Their money stays in Revenue. */
function purgeOld(){
  var cut=addDays(-90),keep=[],changed=false;
  S.orders.forEach(function(o){
    if(o.status==='Picked up'&&o.doneDate&&o.doneDate<cut){archiveOrder(o);changed=true;}else keep.push(o);
  });
  if(changed){S.orders=keep;save();}
}
function dayMap(){
  var m={};function d(k){return m[k]||(m[k]={inn:0,out:0,orders:0});}
  Object.keys(S.archive).forEach(function(k){var a=S.archive[k],x=d(k);x.inn+=a.inn;x.out+=a.out;x.orders+=a.orders;});
  S.orders.forEach(function(o){
    var x=d(o.date);x.orders++;x.out+=expenses(o);x.inn+=o.deposit;
    o.adds.forEach(function(p){d(p.date).inn+=p.amt;});
  });
  return m;
}
function weekStart(k){var d=parse(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d);}
function bucketKey(k,g){return g==='day'?k:g==='week'?weekStart(k):k.slice(0,7);}
function periods(g){
  var dm=dayMap(),agg={};
  Object.keys(dm).forEach(function(k){var b=bucketKey(k,g),x=agg[b]||(agg[b]={inn:0,out:0,orders:0});x.inn+=dm[k].inn;x.out+=dm[k].out;x.orders+=dm[k].orders;});
  var n=g==='day'?14:g==='week'?10:12,list=[],now=new Date();
  for(var i=n-1;i>=0;i--){
    var key,label;
    if(g==='day'){key=addDays(-i);label=parse(key).toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
    else if(g==='week'){key=addDays(-7*i,weekStart(todayIso()));label=parse(key).toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
    else{var d=new Date(now.getFullYear(),now.getMonth()-i,1);key=iso(d).slice(0,7);label=d.toLocaleDateString('en-GB',{month:'short',year:'2-digit'});}
    var x=agg[key]||{inn:0,out:0,orders:0};
    list.push({key:key,label:label,inn:x.inn,out:x.out,orders:x.orders,net:x.inn-x.out});
  }
  return list;
}

</script>
<script>
/* js/lib/chart.js */
/* Silky Stylish / js/lib/chart.js

'use strict';

function niceStep(range,count){var raw=(range||1)/count,mag=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)),r=raw/mag;return (r<=1?1:r<=2?2:r<=5?5:10)*mag;}
function kfmt(v){var a=Math.abs(v),s=a>=1e6?(a/1e6).toFixed(a%1e6?1:0)+'M':a>=1000?(a/1000).toFixed(a%1000?1:0)+'k':String(Math.round(a));return (v<0?'-':'')+s;}
function lineChart(pts,opt){
  var W=560,H=240,L=54,R=22,T=40,B=34,pw=W-L-R,ph=H-T-B;
  var vals=pts.map(function(p){return p.v;}),lo=Math.min(0,Math.min.apply(null,vals)),hi=Math.max(1,Math.max.apply(null,vals));
  var step=niceStep(hi-lo,4);if(!opt.money)step=Math.max(1,step);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;if(hi===lo)hi=lo+step;

  for(v=lo;v<=hi+step/2;v+=step){var y=Y(v).toFixed(1);s+='<line class="grid'+(Math.abs(v)<1e-9?' zero':'')+'" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="tick" x="'+(L-8)+'" y="'+(+y+4)+'" text-anchor="end">'+(opt.money?kfmt(v):Math.round(v))+'</text>';}
  var every=Math.ceil(pts.length/7);
  pts.forEach(function(p,i){if((pts.length-1-i)%every===0)s+='<text class="tick" x="'+X(i).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle">'+esc(p.label)+'</text>';});
  var base=Y(Math.max(0,lo)).toFixed(1),path='';
  pts.forEach(function(p,i){path+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)+' ';});
  s+='<path class="area" d="'+path+'L'+X(pts.length-1).toFixed(1)+' '+base+' L'+X(0).toFixed(1)+' '+base+' Z"/><path class="ln" d="'+path.trim()+'"/>';
  pts.forEach(function(p,i){
    var last=i===pts.length-1;
    s+='<circle class="pt" cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(last?5:3)+'"><title>'+esc(p.label+': '+(opt.money?kes(p.v):p.v))+'</title></circle>';
  });
  var lp=pts[pts.length-1],ly=Y(lp.v);
  s+='<text class="val" x="'+X(pts.length-1).toFixed(1)+'" y="'+(ly-11).toFixed(1)+'" text-anchor="end">'+esc(opt.money?kes(lp.v):lp.v)+'</text>';

}

<script>

function trackTable(title,note,list,kind){

function track(){

  else if(a==='editOrder')orderForm(o);
  else if(a==='advance'){o.status=STATUSES[STATUSES.indexOf(o.status)+1];if(o.status==='Picked up')o.doneDate=todayIso();save();render();viewOrder(o);gSyncSoon(o.id);}
  else if(a==='addMoney'){pendingView=o.id;openForm('Add money: '+o.no,[{id:'amt',label:'Amount received (KES), balance '+balance(o),type:'number',value:balance(o)||'',req:true},{id:'date',label:'Date',type:'date',value:todayIso(),half:true},{id:'note',label:'Note',half:true}],function(v){o.adds.push({id:uid(),amt:num(v.amt),date:v.date||todayIso(),note:v.note});gSyncSoon(o.id);},'Add money');}
  else if(a==='delAdd'){o.adds=o.adds.filter(function(m){return m.id!==el.dataset.aid;});save();render();viewOrder(o);}
  else if(a==='delOrder'){
    if(el.dataset.armed){gRemoveOrder(o);S.orders=S.orders.filter(function(x){return x.id!==id;});save();closeForm();render();}
    else{el.dataset.armed='1';el.textContent='Tap again to delete';}
  }
  else if(a==='tailors'){
    openForm('Tailors',[{id:'names',label:'One tailor name per line',type:'textarea',value:S.tailors.join('\n')}],function(v){S.tailors=v.names.split('\n').map(function(x){return x.trim();}).filter(Boolean);},'Save tailors');
    document.getElementById('f_names').rows=5;
  }
  else if(a==='prevMonth'){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1);render();}
  else if(a==='nextMonth'){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1);render();}
  else if(a==='toOngoing'){o.status='Cutting';save();render();gSyncSoon(o.id);}
  else if(a==='toDone'){
    if(balance(o)>0&&!el.dataset.armed){el.dataset.armed='1';el.textContent='Balance '+kes(balance(o))+'. Tap again to complete';return;}
    o.status='Picked up';o.doneDate=todayIso();save();render();gSyncSoon(o.id);
  }
  else if(a==='backPending'){o.status='New';save();render();gSyncSoon(o.id);}
  else if(a==='backOngoing'){o.status='Ready';o.doneDate='';save();render();gSyncSoon(o.id);}
  else if(a==='gConnect')gConnect();
  else if(a==='gSyncAll')gSyncAll();
  else if(a==='gSettings')gSettings();
  else if(a==='clearSample'){S={orders:[],tailors:S.tailors,nextSeq:1,archive:{},settings:S.settings||{gRemoveNos:[]},sample:false};save();render();}
});
document.addEventListener('input',function(e){if(e.target.id==='oq'){orderQ=e.target.value;render();}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')cancelForm();});
purgeOld();
save();
document.getElementById('logout').onclick=function(){closeForm();GFG_AUTH.logout();};
render();
})();

</script>
</body>
</html>
